<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Car Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #87CEEB;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            z-index: 100;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            min-width: 250px;
        }

        #hud div {
            margin: 8px 0;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            z-index: 100;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            text-align: right;
        }

        .speed-bar {
            width: 200px;
            height: 10px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 5px;
        }

        .speed-fill {
            height: 100%;
            background: linear-gradient(90deg, #00FF00, #FFFF00, #FF6600, #FF0000);
            width: 0%;
            transition: width 0.1s ease-out;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div><strong>Speed:</strong> <span id="speed">0</span> km/h</div>
        <div class="speed-bar">
            <div class="speed-fill" id="speedBar"></div>
        </div>
        <div><strong>Distance:</strong> <span id="distance">0</span> m</div>
    </div>

    <div id="controls">
        <div>⬆️ Accelerate</div>
        <div>⬇️ Brake/Reverse</div>
        <div>⬅️ Steer Left</div>
        <div>➡️ Steer Right</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
